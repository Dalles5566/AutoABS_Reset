<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出海前准备</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="出海">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #cfe8ff;
            color: #1a2733;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 2px;
            color: #0069c0;
        }

        h2 {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4a6072;
        }

        .date-status {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 20px;
            color: #4a6072;
        }

        .date-status .status {
            font-weight: bold;
            margin-left: 8px;
        }

        .date-status .status.done {
            color: #2e7d32;
        }

        .date-status .status.pending {
            color: #e07000;
        }

        .top-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .top-links a {
            color: #0069c0;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid #9dc7ea;
            padding: 8px 16px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .top-links a:active {
            background: #b8dbf7;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #0091ea;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
            background: #0077c2;
        }

        .btn.secondary {
            background: #eaf4fd;
            color: #0069c0;
            border: 2px solid #9dc7ea;
        }

        .btn.secondary:active {
            background: #d7ebfb;
        }

        #output {
            margin: 20px auto 0;
            max-width: 500px;
        }

        .group {
            display: block;
            background: #ffffff;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(0, 60, 120, 0.1);
            transition: opacity 0.3s;
        }

        .group.all-done {
            opacity: 0.45;
        }

        .group-header {
            font-size: 0.85rem;
            color: #0069c0;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* 子分组 */
        .subgroup {
            display: block;
            background: #f2f8fe;
            border: 1px solid #cfe3f5;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            transition: opacity 0.3s;
        }

        .subgroup:last-child {
            margin-bottom: 0;
        }

        .subgroup.all-done {
            opacity: 0.45;
        }

        .subgroup-header {
            font-size: 0.8rem;
            color: #0077c2;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* 每个清单项按钮 */
        .item-btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
            background: #ffffff;
            color: #1a2733;
            border: 2px solid #d5e6f4;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, opacity 0.3s;
        }

        .item-btn:last-child {
            margin-bottom: 0;
        }

        .item-btn:active {
            background: #eaf4fd;
        }

        .item-btn.completed {
            border-color: #66bb6a;
            background: #eafaeb;
            opacity: 0.6;
        }

        .item-btn .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-btn .item-name {
            display: block;
        }

        .item-btn .item-check {
            font-size: 1.2rem;
            color: #b0c4d4;
            margin-left: 8px;
        }

        .item-btn.completed .item-check {
            color: #2e7d32;
        }

        .item-btn .item-note {
            display: block;
            font-size: 0.9rem;
            color: #c26a00;
            font-weight: normal;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>🛥️🛥️🛥️ 出海 🛥️🛥️🛥️</h1>
    <h2>出海前准备</h2>
    <div class="date-status" id="dateStatus"></div>

    <div class="top-links">
        <a href="fishing.html">🎣 钓鱼清单</a>
    </div>

    <button class="btn secondary" onclick="resetAll()">重置清单</button>
    <div id="output"></div>

    <script>
        // 出海前准备清单，分组管理。
        // 普通组用 items；带子分组的组用 subgroups（每个子组有 title + items）。
        const groups = 
        [
                {
                    title: "① 组装充气艇",
                    items: [
                        { name: "给『充气艇』打气", note: "给『充气艇』打气" },
                        { name: "安装『Paddles』", note: "把桨安装/放到船上" }
                    ]
                },
                {
                    title: "② 安装动力",
                    items: [
                        { name: "安装『Mercury 3.5』", note: "把马达安装到船尾并锁紧" },
                        { name: "确认『Fuel』", note: "确认马达主油箱有油" }
                    ]
                },
                {
                    title: "③ 整理船上装备",
                    items: [
                        { name: "『Anchor』放进【Floating Bag】", note: "锚放进防水袋" },
                        { name: "『Anchor Rope』放进【Floating Bag】", note: "锚绳放进防水袋" },
                        { name: "『Extra Fuel』放上船", note: "备用油固定好" },
                        { name: "『Fishing Rod』放上船", note: "鱼竿放上船" },
                        { name: "『Fishing Box』放上船", note: "钓鱼桶放上船" }
                    ]
                },
                {
                    title: "④ 收拾岸上装备",
                    items: [
                        { name: "『Air Pump』放回【车里】", note: "气泵放回车里" }
                    ]
                },
                {
                    title: "⑤ 处理随身物品",
                    items: [
                        { name: "『iPhone』放进【Waterproof Phone Case】", note: "手机防水" },
                        { name: "『Car Key』放进【Floating Bag】", note: "车钥匙防水保存" },
                        { name: "戴上『Sun Hat』", note: "太阳帽" },
                        { name: "戴上『Sunglasses』", note: "太阳镜" }
                    ]
                },
                {
                    title: "⑥ 准备上船",
                    items: [
                        { name: "穿上🦺『Life Jacket』🦺", note: "救生衣穿好并扣紧" },
                        { name: "确认『Whistle + Compass』", note: "确认都挂在救生衣上" },
                        { name: "『Floating Bag』放上船", note: "防水袋放上船并固定" }
                    ]
                },
                {
                    title: "⑦ 启航前最后一步",
                    items: [
                        { name: "连接『Kill Switch Lanyard』", note: "熄火绳连接到身上" }
                    ]
                }
        ];

        const STORAGE_KEY = 'sailing-checklist-state';

        // 读取保存的完成状态：{ "组标题::项名" 或 "组::子组::项名": true }
        function loadState() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        let state = loadState();

        function itemKey(scope, name) {
            return scope + '::' + name;
        }

        function getToday() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[d.getDay()];
            return `${year}/${month}/${day}（周${weekday}）`;
        }

        function updateDateStatus() {
            const total = document.querySelectorAll('.item-btn').length;
            const done = document.querySelectorAll('.item-btn.completed').length;
            const statusEl = document.getElementById('dateStatus');
            const allDone = total > 0 && done === total;
            statusEl.innerHTML = `${getToday()} <span class="status ${allDone ? 'done' : 'pending'}">${allDone ? '✅ 都齐了' : `⏳ ${done}/${total}`}</span>`;
        }

        // 某个容器（子组或大组）里的项是否全部完成
        function isContainerDone(el) {
            const buttons = el.querySelectorAll('.item-btn');
            return buttons.length > 0 && Array.from(buttons).every(b => b.classList.contains('completed'));
        }

        // 子组全部完成 -> 沉到所属大组内的底部。返回该子组是否已完成
        function checkSubgroupDone(subEl) {
            if (!subEl) return false;
            const allDone = isContainerDone(subEl);
            if (allDone) {
                subEl.classList.add('all-done');
                subEl.parentNode.appendChild(subEl);
            } else {
                subEl.classList.remove('all-done');
            }
            return allDone;
        }

        // 大组全部完成 -> 沉到最外层底部。返回该组是否已完成
        function checkGroupDone(groupEl) {
            const allDone = isContainerDone(groupEl);
            if (allDone) {
                groupEl.classList.add('all-done');
                groupEl.parentNode.appendChild(groupEl);
            } else {
                groupEl.classList.remove('all-done');
            }
            return allDone;
        }

        // 滚动到下一个还没完成的目标：
        // 优先滚到「当前大组内」下一个未完成的子组；
        // 若当前大组已全部完成，则滚到下一个未完成的大组。
        // 把目标元素滚到距屏幕顶部约 20% 的位置（比顶到最上边舒服，又不至于太靠下）
        function scrollToElement(el) {
            const offset = window.innerHeight * 0.3;
            const top = el.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }

        function scrollToNextPending(currentGroupEl) {
            if (currentGroupEl && !currentGroupEl.classList.contains('all-done')) {
                const nextSub = Array.from(currentGroupEl.querySelectorAll('.subgroup'))
                    .find(s => !s.classList.contains('all-done'));
                if (nextSub) {
                    scrollToElement(nextSub);
                    return;
                }
            }
            const nextGroup = Array.from(document.querySelectorAll('.group'))
                .find(g => !g.classList.contains('all-done'));
            if (nextGroup) {
                scrollToElement(nextGroup);
            }
        }

        function handleItemClick(btn) {
            const groupEl = btn.closest('.group');
            const subEl = btn.closest('.subgroup');
            const isCompleted = btn.classList.toggle('completed');
            btn.querySelector('.item-check').textContent = isCompleted ? '✓' : '○';

            // 保存状态
            const key = btn.dataset.key;
            if (isCompleted) {
                state[key] = true;
            } else {
                delete state[key];
            }
            saveState(state);

            updateDateStatus();

            // 先处理子组沉底，再看大组是否整体完成
            const subJustDone = checkSubgroupDone(subEl);
            const groupJustDone = checkGroupDone(groupEl);

            if (isCompleted && (subJustDone || groupJustDone)) {
                // 刚完成一个子组或大组 -> 自动滚到下一个待办（大滚动优先，不再叠加小微调）
                setTimeout(() => scrollToNextPending(groupEl), 350);
            } else {
                // 普通勾选/取消 -> 稍微挪一点点：勾选往上，取消往下（复位）
                const step = btn.offsetHeight + 7; // 一项的高度 + 间距
                window.scrollBy({ top: isCompleted ? step : -step, behavior: 'smooth' });
            }
        }

        function render() {
            const output = document.getElementById('output');

            // 渲染单个清单项按钮。keyScope 用于生成唯一 key（大组标题或大组::子组）
            function renderItem(keyScope, item) {
                const key = itemKey(keyScope, item.name);
                const done = !!state[key];
                const noteHtml = item.note ? `<span class="item-note">${item.note}</span>` : '';
                return `<button class="item-btn ${done ? 'completed' : ''}"
                    data-key="${key}"
                    onclick="handleItemClick(this)">
                    <div class="item-top">
                        <span class="item-name">${item.name}</span>
                        <span class="item-check">${done ? '✓' : '○'}</span>
                    </div>
                    ${noteHtml}
                </button>`;
            }

            output.innerHTML = groups.map(group => {
                let body;
                if (group.subgroups) {
                    // 带子分组的大组
                    body = group.subgroups.map(sub => {
                        const scope = group.title + '::' + sub.title;
                        const items = sub.items.map(item => renderItem(scope, item)).join('');
                        return `<div class="subgroup">
                            <div class="subgroup-header">${sub.title}</div>
                            ${items}
                        </div>`;
                    }).join('');
                } else {
                    // 普通组
                    body = group.items.map(item => renderItem(group.title, item)).join('');
                }

                return `<div class="group">
                    <div class="group-header">${group.title}</div>
                    ${body}
                </div>`;
            }).join('');

            // 已经全完成的子组/大组，初始就沉底
            document.querySelectorAll('.subgroup').forEach(s => checkSubgroupDone(s));
            document.querySelectorAll('.group').forEach(g => checkGroupDone(g));
            updateDateStatus();
        }

        function resetAll() {
            state = {};
            saveState(state);
            render();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        render();
    </script>
</body>
</html>
